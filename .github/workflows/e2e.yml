name: E2E Salesforce QA

# ── Trigger 1: manual desde GitHub UI ────────────────────────────────────────
# ── Trigger 2: POST desde Postman / cualquier cliente HTTP ───────────────────
#
#   POST https://api.github.com/repos/giturralde1980/oca/dispatches
#   Authorization: Bearer <GITHUB_PAT>
#   Content-Type: application/json
#
#   {
#     "event_type": "run-e2e-tests",
#     "client_payload": {
#       "test_env":     "qa",
#       "test_pattern": "quotes/"
#     }
#   }
on:
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Entorno a testear'
        required: true
        default: 'qa'
        type: choice
        options: [qa, int, stg, prd]
      test_pattern:
        description: 'Patrón Jest (ej: quotes/, quotes/industria)'
        required: false
        default: 'quotes/'

  repository_dispatch:
    types: [run-e2e-tests]

jobs:
  e2e:
    name: E2E · ${{ github.event.inputs.test_env || github.event.client_payload.test_env || 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resuelve los inputs independientemente de cómo se lanzó el workflow
      - name: Resolve inputs
        id: ctx
        run: |
          TEST_ENV="${{ github.event.inputs.test_env || github.event.client_payload.test_env || 'qa' }}"
          TEST_PATTERN="${{ github.event.inputs.test_pattern || github.event.client_payload.test_pattern || 'quotes/' }}"
          echo "test_env=${TEST_ENV}"         >> $GITHUB_OUTPUT
          echo "test_pattern=${TEST_PATTERN}" >> $GITHUB_OUTPUT

      # Escribe el fichero .env.<env> usando printf para que caracteres especiales
      # del Consumer Key (=, +, /) no sean interpretados por el shell
      - name: Write .env file
        env:
          SF_BASE_URL:      ${{ secrets.SF_BASE_URL }}
          SF_CLIENT_ID:     ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
        run: |
          printf 'SF_BASE_URL=%s\nSF_CLIENT_ID=%s\nSF_CLIENT_SECRET=%s\nSF_API_VERSION=v59.0\n' \
            "${SF_BASE_URL}" "${SF_CLIENT_ID}" "${SF_CLIENT_SECRET}" \
            > .env.${{ steps.ctx.outputs.test_env }}
          echo "→ .env escritos: $(wc -c < .env.${{ steps.ctx.outputs.test_env }}) bytes | SF_CLIENT_ID length=$(printf '%s' "${SF_CLIENT_ID}" | wc -c)"

      - name: Run E2E tests
        id: tests
        env:
          TEST_ENV: ${{ steps.ctx.outputs.test_env }}
        run: |
          npx jest \
            --testPathPatterns "${{ steps.ctx.outputs.test_pattern }}" \
            --verbose \
            --forceExit

      # ── Detecta si los secrets opcionales están configurados ─────────────────
      - name: Resolve optional secrets
        if: always()
        id: opt
        env:
          GMAIL_PWD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GDRIVE_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          [[ -n "${GMAIL_PWD}"  ]] && echo "gmail=true"  >> $GITHUB_OUTPUT || echo "gmail=false"  >> $GITHUB_OUTPUT
          [[ -n "${GDRIVE_KEY}" ]] && echo "gdrive=true" >> $GITHUB_OUTPUT || echo "gdrive=false" >> $GITHUB_OUTPUT

      # ── Localiza el reporte HTML combinado ───────────────────────────────────
      - name: Find combined report
        if: always()
        id: report
        run: |
          FILE=$(ls reports/e2e_[0-9]*.html 2>/dev/null | head -1 \
              || ls reports/e2e_*.html 2>/dev/null | head -1 \
              || echo "")
          echo "file=${FILE}" >> $GITHUB_OUTPUT
          echo "→ report: ${FILE}"

      # ── Email con el HTML adjunto ─────────────────────────────────────────────
      # Requiere en GitHub Secrets:
      #   GMAIL_USERNAME     → german.iturralde@gmail.com
      #   GMAIL_APP_PASSWORD → contraseña de aplicación (16 chars)
      #                        https://myaccount.google.com/apppasswords
      - name: Send email report
        if: always() && steps.opt.outputs.gmail == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: >
            E2E ${{ steps.ctx.outputs.test_env }} — ${{ job.status }} — run #${{ github.run_number }}
          to: german.iturralde@gmail.com
          from: E2E QA <${{ secrets.GMAIL_USERNAME }}>
          html_body: |
            <h2>E2E Salesforce QA</h2>
            <table cellpadding="6" style="border-collapse:collapse">
              <tr><td><b>Entorno</b></td><td>${{ steps.ctx.outputs.test_env }}</td></tr>
              <tr><td><b>Patrón</b></td><td>${{ steps.ctx.outputs.test_pattern }}</td></tr>
              <tr><td><b>Estado</b></td><td><b>${{ job.status }}</b></td></tr>
              <tr><td><b>Run</b></td><td>#${{ github.run_number }}</td></tr>
            </table>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              Ver logs completos en GitHub Actions
            </a></p>
            <p>El reporte HTML completo se adjunta a este correo.</p>
          attachments: ${{ steps.report.outputs.file }}

      # ── Google Drive ──────────────────────────────────────────────────────────
      # Requiere en GitHub Secrets:
      #   GDRIVE_SA_KEY     → JSON completo de la Service Account (Google Cloud)
      #   GDRIVE_FOLDER_ID  → ID de la carpeta de Drive (compartida con la SA)
      #
      # Setup (una sola vez):
      #   1. Google Cloud Console → APIs → Drive API → Habilitar
      #   2. IAM → Service Accounts → Crear → descargar JSON → pegar en GDRIVE_SA_KEY
      #   3. En Drive, compartir la carpeta destino con el email de la SA (editor)
      #   4. Copiar el ID de la carpeta (parte final de la URL) → GDRIVE_FOLDER_ID
      - name: Upload to Google Drive
        if: always() && steps.opt.outputs.gdrive == 'true'
        env:
          GDRIVE_SA_KEY:    ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          REPORT_FILE:      ${{ steps.report.outputs.file }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 - <<'PYEOF'
          import os, json, glob, sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account

          sa_info   = json.loads(os.environ['GDRIVE_SA_KEY'])
          folder_id = os.environ.get('GDRIVE_FOLDER_ID', '')
          report    = os.environ.get('REPORT_FILE', '')

          creds = service_account.Credentials.from_service_account_info(
              sa_info, scopes=['https://www.googleapis.com/auth/drive.file']
          )
          service = build('drive', 'v3', credentials=creds, cache_discovery=False)

          files = [report] if (report and os.path.isfile(report)) else glob.glob('reports/e2e_*.html')
          if not files:
              print('No report files found — skip Drive upload')
              sys.exit(0)

          for f in files:
              name = os.path.basename(f)
              meta = {'name': name}
              if folder_id:
                  meta['parents'] = [folder_id]
              media  = MediaFileUpload(f, mimetype='text/html')
              result = service.files().create(body=meta, media_body=media, fields='id,name').execute()
              print(f"Uploaded: {result['name']} → https://drive.google.com/file/d/{result['id']}/view")
          PYEOF
