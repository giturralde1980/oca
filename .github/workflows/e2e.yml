name: E2E Salesforce QA

# ── Trigger 1: manual desde GitHub UI ────────────────────────────────────────
# ── Trigger 2: POST desde Postman / cualquier cliente HTTP ───────────────────
#
#   POST https://api.github.com/repos/giturralde1980/oca/dispatches
#   Authorization: Bearer <GITHUB_PAT>
#   Content-Type: application/json
#
#   {
#     "event_type": "run-e2e-tests",
#     "client_payload": {
#       "test_env":     "qa",
#       "test_pattern": "quotes/"
#     }
#   }
on:
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Entorno a testear'
        required: true
        default: 'qa'
        type: choice
        options: [qa, int, stg, prd]
      test_pattern:
        description: 'Patrón Jest (ej: quotes/, quotes/industria)'
        required: false
        default: 'quotes/'

  repository_dispatch:
    types: [run-e2e-tests]

jobs:
  e2e:
    name: E2E · ${{ github.event.inputs.test_env || github.event.client_payload.test_env || 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve inputs
        id: ctx
        run: |
          TEST_ENV="${{ github.event.inputs.test_env || github.event.client_payload.test_env || 'qa' }}"
          TEST_PATTERN="${{ github.event.inputs.test_pattern || github.event.client_payload.test_pattern || 'quotes/' }}"
          echo "test_env=${TEST_ENV}"         >> $GITHUB_OUTPUT
          echo "test_pattern=${TEST_PATTERN}" >> $GITHUB_OUTPUT

      - name: Write .env file
        env:
          SF_BASE_URL:      ${{ secrets.SF_BASE_URL }}
          SF_CLIENT_ID:     ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
        run: |
          printf 'SF_BASE_URL=%s\nSF_CLIENT_ID=%s\nSF_CLIENT_SECRET=%s\nSF_API_VERSION=v59.0\n' \
            "${SF_BASE_URL}" "${SF_CLIENT_ID}" "${SF_CLIENT_SECRET}" \
            > .env.${{ steps.ctx.outputs.test_env }}

      - name: Run E2E tests
        id: tests
        env:
          TEST_ENV: ${{ steps.ctx.outputs.test_env }}
        run: |
          npx jest \
            --testPathPatterns "${{ steps.ctx.outputs.test_pattern }}" \
            --verbose \
            --forceExit

      # ── Sube el reporte HTML a Google Drive ───────────────────────────────────
      # Secrets necesarios (una sola vez en github.com/giturralde1980/oca/settings/secrets/actions):
      #
      #   GDRIVE_SA_KEY    → JSON completo de la Service Account de Google Cloud
      #   GDRIVE_FOLDER_ID → ID de la carpeta de Drive compartida con la Service Account
      #
      # Setup paso a paso:
      #   1. console.cloud.google.com → nuevo proyecto → habilitar "Google Drive API"
      #   2. IAM → Cuentas de servicio → Crear → descargar clave JSON → pegar en GDRIVE_SA_KEY
      #   3. En Drive: crear carpeta "E2E Reports" → compartir con el email de la SA (editor)
      #   4. Copiar el ID de la carpeta desde la URL → pegar en GDRIVE_FOLDER_ID
      - name: Upload report to Google Drive
        if: always()
        env:
          GDRIVE_SA_KEY:    ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [[ -z "${GDRIVE_SA_KEY}" ]]; then
            echo "⚠ GDRIVE_SA_KEY no configurado — omitiendo subida a Drive"
            exit 0
          fi
          pip install --quiet google-api-python-client google-auth
          python3 - <<'PYEOF'
          import os, json, glob, sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account

          sa_info   = json.loads(os.environ['GDRIVE_SA_KEY'])
          folder_id = os.environ.get('GDRIVE_FOLDER_ID', '')

          creds = service_account.Credentials.from_service_account_info(
              sa_info, scopes=['https://www.googleapis.com/auth/drive.file']
          )
          service = build('drive', 'v3', credentials=creds, cache_discovery=False)

          files = sorted(glob.glob('reports/e2e_*.html'))
          if not files:
              print('No report files found — skip Drive upload')
              sys.exit(0)

          for f in files:
              name = os.path.basename(f)
              meta = {'name': name}
              if folder_id:
                  meta['parents'] = [folder_id]
              media  = MediaFileUpload(f, mimetype='text/html')
              result = service.files().create(body=meta, media_body=media, fields='id,name').execute()
              print(f"✓ {result['name']} → https://drive.google.com/file/d/{result['id']}/view")
          PYEOF
