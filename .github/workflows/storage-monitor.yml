name: Salesforce Storage Monitor

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC diario
    - cron: '30 20 * * *'  # 20:30 UTC diario
  workflow_dispatch:        # lanzamiento manual desde GitHub UI

jobs:
  check-storage:
    name: Storage Check · ${{ github.event_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Salesforce storage limits
        id: check-storage
        env:
          SF_BASE_URL:      ${{ secrets.SF_BASE_URL }}
          SF_CLIENT_ID:     ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.parse
          from datetime import datetime, timezone

          base_url      = os.environ['SF_BASE_URL']
          client_id     = os.environ['SF_CLIENT_ID']
          client_secret = os.environ['SF_CLIENT_SECRET']
          summary_file  = os.environ.get('GITHUB_STEP_SUMMARY', '')

          # ── Auth ──────────────────────────────────────────────────────────────
          body = urllib.parse.urlencode({
              'grant_type':    'client_credentials',
              'client_id':     client_id,
              'client_secret': client_secret,
          }).encode()
          req  = urllib.request.Request(base_url, data=body, method='POST')
          resp = urllib.request.urlopen(req)
          auth = json.loads(resp.read())
          token        = auth['access_token']
          instance_url = auth['instance_url']

          # ── Limits API ────────────────────────────────────────────────────────
          req = urllib.request.Request(
              f'{instance_url}/services/data/v59.0/limits/',
              headers={'Authorization': f'Bearer {token}'},
          )
          limits = json.loads(urllib.request.urlopen(req).read())

          # ── Checks ────────────────────────────────────────────────────────────
          THRESHOLD = 98
          CHECKS = [
              ('DataStorageMB',      'Data Storage'),
              ('FileStorageMB',      'File Storage'),
              ('BigObjectStorageMB', 'Big Object Storage'),
          ]

          now    = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          rows   = []
          alerts = []

          for key, label in CHECKS:
              if key not in limits:
                  rows.append((label, 'N/A', 'N/A', 'N/A', False))
                  continue
              entry     = limits[key]
              maximum   = entry['Max']
              remaining = entry['Remaining']
              used      = maximum - remaining
              pct       = round(used / maximum * 100, 1) if maximum > 0 else 0
              over      = pct >= THRESHOLD
              rows.append((label, f'{used:,.0f}', f'{maximum:,.0f}', f'{pct:.1f}%', over))
              if over:
                  alerts.append((label, pct, used, maximum))

          # ── Job Summary (Markdown) ─────────────────────────────────────────────
          status_icon = '🔴' if alerts else '🟢'
          status_text = 'ALERTA — Acción requerida' if alerts else 'OK — Dentro de límites'

          md = [
              f'## {status_icon} Salesforce Storage Monitor',
              f'**{now}** &nbsp;·&nbsp; Umbral de alerta: **{THRESHOLD}%**',
              '',
              '| Tipo | Usado (MB) | Límite (MB) | % Usado | Estado |',
              '|---|--:|--:|--:|:---:|',
          ]
          for label, used, maximum, pct, over in rows:
              icon = '⚠️' if over else '✅'
              md.append(f'| {label} | {used} | {maximum} | {pct} | {icon} |')

          md += ['']
          if alerts:
              md.append('### ⚠️ Almacenamiento crítico')
              for label, pct, used, maximum in alerts:
                  md.append(f'- **{label}**: {pct}% usado ({used:,.0f} MB de {maximum:,.0f} MB)')
          else:
              md.append(f'> Todos los tipos de almacenamiento están por debajo del {THRESHOLD}%.')

          md_text = '\n'.join(md)

          if summary_file:
              with open(summary_file, 'w') as f:
                  f.write(md_text)

          # ── Consola (fallback) ────────────────────────────────────────────────
          print(f'\nSalesforce Storage — {now}')
          print(f"{'Tipo':<25} {'Usado':>12} {'Límite':>12} {'%':>8}")
          print('-' * 60)
          for label, used, maximum, pct, over in rows:
              flag = ' ⚠' if over else ''
              print(f'{label:<25} {used:>12} {maximum:>12} {pct:>8}{flag}')
          print()

          if alerts:
              print(f'ALERTA: almacenamiento >= {THRESHOLD}%')
              sys.exit(1)
          else:
              print(f'OK — todos los tipos por debajo del {THRESHOLD}%.')
          PYEOF

      - name: Resolve email recipients
        id: recipients
        if: steps.check-storage.conclusion == 'failure'
        run: |
          DEFAULT="${{ secrets.MAIL_TO }}"
          FALLBACK="test@test.com"
          echo "to=${DEFAULT:-$FALLBACK}" >> $GITHUB_OUTPUT

      - name: Send report by email
        if: steps.check-storage.conclusion == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ steps.recipients.outputs.to }}
          from: ${{ secrets.GMAIL_USER }}
          subject: "[ALERTA] Salesforce Storage >= 98% - Run #${{ github.run_number }}"
          body: |
            ALERTA: El almacenamiento de Salesforce superó el umbral del 98%.

            Workflow run: #${{ github.run_number }}
            Triggered by: ${{ github.actor }}

            Revisar el Job Summary del workflow para ver el detalle por tipo de almacenamiento.
